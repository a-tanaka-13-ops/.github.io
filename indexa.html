<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校物理：電位3Dシミュレーター（等高線付き電位曲面）</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212; color: #ffffff;
        }
        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        #ui-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            width: 380px; max-height: calc(100vh - 30px);
            background: rgba(24, 24, 27, 0.88); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
        }
        h1 { font-size: 16px; margin: 0; color: #4facfe; }
        .description { font-size: 11px; color: #a0a0a0; margin: 0; line-height: 1.4; }
        .control-group {
            background: rgba(255, 255, 255, 0.05); padding: 10px;
            border-radius: 8px; display: flex; flex-direction: column; gap: 8px;
        }
        .control-group label { font-size: 12px; font-weight: bold; color: #ddd; }
        .checkbox-group {
            display: flex; gap: 12px; font-size: 11px; color: #ccc; align-items: center;
        }
        .checkbox-group label { font-weight: normal; font-size: 11px; cursor: pointer; }
        .slider-container {
            display: flex; align-items: center; gap: 8px; font-size: 12px; color: #ccc;
        }
        .slider-container input[type="range"] {
            flex-grow: 1; cursor: pointer;
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none; color: #000; font-weight: bold; padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-secondary { background: #3a3a3c; color: #fff; }
        .v-block {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .v-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: bold;
        }
        .v-header input[type="number"] {
            width: 70px; background: #2a2a2a; border: 1px solid #555;
            color: #fff; border-radius: 4px; padding: 2px 4px; text-align: center;
        }
        textarea {
            width: 100%; height: 50px; background: #1e1e1e; border: 1px solid #444;
            color: #fff; font-size: 11px; padding: 4px; border-radius: 4px; resize: vertical;
        }
        .legend {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; background: rgba(0, 0, 0, 0.3); padding: 6px 10px; border-radius: 6px;
        }
        .color-bar {
            height: 8px; flex-grow: 1;
            background: linear-gradient(to right, #3b82f6, #10b981, #ef4444);
            margin: 0 10px; border-radius: 4px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h1>⚡ 電位3Dシミュレーター</h1>
        <p class="description">
            1Vごとのデータ（x, y座標）を入力して3D曲面を作成します。<br>
            ・<b>球体</b>: 入力した測定点<br>
            ・<b>等高線付き曲面</b>: 40×40範囲の電位曲面（白い等高線表示）
        </p>

        <div class="control-group">
            <label>表示切替</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="show-spheres" checked onchange="updateVisibility()"> 球体</label>
                <label><input type="checkbox" id="show-surface" checked onchange="updateVisibility()"> 等高線付き曲面</label>
            </div>
        </div>

        <div class="control-group">
            <label>高さ（Z軸/電位）の倍率</label>
            <div class="slider-container">
                <input type="range" id="height-scale" min="0.1" max="5.0" step="0.1" value="1.0" oninput="onScaleChange()">
                <span id="scale-val">1.0x</span>
            </div>
        </div>

        <div class="control-group">
            <label>電位データの追加・編集</label>
            <div id="v-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
            <button class="btn btn-secondary" onclick="addVBlock(0, '')">+ 電位グループを追加</button>
        </div>

        <button class="btn" onclick="update3DModel()">3Dモデル更新 🚀</button>

        <div class="legend">
            <span style="color: #60a5fa;">-V (負電位)</span>
            <div class="color-bar"></div>
            <span style="color: #f87171;">+V (正電位)</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let spheresGroup, surfaceGroup, gridHelper;
        let vBlockCount = 0;

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(25, 25, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(20, 30, 25);
            scene.add(dirLight);

            spheresGroup = new THREE.Group();
            surfaceGroup = new THREE.Group();
            scene.add(spheresGroup);
            scene.add(surfaceGroup);

            window.addEventListener('resize', onWindowResize);

            // サンプルデータ
            addVBlock(3, " -8,0 ");
            addVBlock(2, " -5,0\n -8,3\n -11,0\n -8,-3 ");
            addVBlock(1, " -2,0\n -8,6\n -14,0\n -8,-6 ");
            addVBlock(0, " 0,0\n 0,8\n 0,-8 ");
            addVBlock(-1, " 2,0\n 8,5\n 14,0\n 8,-5 ");
            addVBlock(-2, " 6,0\n 8,2\n 10,0\n 8,-2 ");

            update3DModel();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function addVBlock(vValue, defaultCoords) {
            vBlockCount++;
            const id = vBlockCount;
            const container = document.getElementById('v-list');

            const div = document.createElement('div');
            div.className = 'v-block';
            div.id = `v-block-${id}`;
            div.innerHTML = `
                <div class="v-header">
                    <span>電位: <input type="number" step="0.5" value="${vValue}" id="v-val-${id}"> V</span>
                    <button class="btn btn-danger" style="padding: 2px 6px; font-size: 10px;" onclick="removeVBlock(${id})">削除</button>
                </div>
                <textarea id="v-coords-${id}" placeholder="x, y の形式で入力&#10;例:&#10;1, 2&#10;1.5, 3">${defaultCoords}</textarea>
            `;
            container.appendChild(div);
        }

        function removeVBlock(id) {
            const el = document.getElementById(`v-block-${id}`);
            if (el) el.remove();
        }

        function getColorForV(v, maxV) {
            const norm = v / (maxV || 1);
            const color = new THREE.Color();
            if (norm > 0) {
                color.lerpColors(new THREE.Color(0x10b981), new THREE.Color(0xef4444), Math.min(norm, 1));
            } else {
                color.lerpColors(new THREE.Color(0x10b981), new THREE.Color(0x3b82f6), Math.min(-norm, 1));
            }
            return color;
        }

        function updateVisibility() {
            spheresGroup.visible = document.getElementById('show-spheres').checked;
            surfaceGroup.visible = document.getElementById('show-surface').checked;
        }

        function onScaleChange() {
            const scale = parseFloat(document.getElementById('height-scale').value);
            document.getElementById('scale-val').textContent = scale.toFixed(1) + 'x';
            update3DModel();
        }

        function update3DModel() {
            while(spheresGroup.children.length > 0) spheresGroup.remove(spheresGroup.children[0]);
            while(surfaceGroup.children.length > 0) surfaceGroup.remove(surfaceGroup.children[0]);
            if (gridHelper) scene.remove(gridHelper);

            const heightScale = parseFloat(document.getElementById('height-scale').value) || 1.0;

            // 基準平面（40×40）
            gridHelper = new THREE.GridHelper(40, 40, 0x888888, 0x444444);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const blocks = document.querySelectorAll('.v-block');
            let maxV = 1;
            const allPoints = [];

            blocks.forEach(block => {
                const id = block.id.replace('v-block-', '');
                const v = parseFloat(document.getElementById(`v-val-${id}`).value) || 0;
                const text = document.getElementById(`v-coords-${id}`).value;

                if (Math.abs(v) > maxV) maxV = Math.abs(v);

                const lines = text.split('\n');
                lines.forEach(line => {
                    const parts = line.trim().split(/[, \t]+/);
                    if (parts.length >= 2) {
                        const x = parseFloat(parts[0]);
                        const y = parseFloat(parts[1]);
                        if (!isNaN(x) && !isNaN(y)) {
                            if (Math.abs(x) <= 20 && Math.abs(y) <= 20) {
                                allPoints.push({ x, y, v, pos: new THREE.Vector3(x, v * heightScale, y) });
                            }
                        }
                    }
                });
            });

            // 1. 球体プロット
            allPoints.forEach(p => {
                const geometry = new THREE.SphereGeometry(0.3, 16, 16);
                const color = getColorForV(p.v, maxV);
                const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.copy(p.pos);
                spheresGroup.add(sphere);
            });

            // 2. 電位曲面
            if (allPoints.length >= 3) {
                const resolution = 100;
                const size = 40;
                const geometry = new THREE.PlaneGeometry(size, size, resolution, resolution);
                geometry.rotateX(-Math.PI / 2);

                const posAttr = geometry.attributes.position;
                const vValues = new Float32Array(posAttr.count);
                const pValue = 2.5;

                for (let i = 0; i < posAttr.count; i++) {
                    const gx = posAttr.getX(i);
                    const gz = posAttr.getZ(i);

                    let num = 0, den = 0, exactV = null;

                    for (let j = 0; j < allPoints.length; j++) {
                        const dist = Math.hypot(gx - allPoints[j].x, gz - allPoints[j].y);
                        if (dist < 0.001) {
                            exactV = allPoints[j].v;
                            break;
                        }
                        const w = 1 / Math.pow(dist, pValue);
                        num += w * allPoints[j].v;
                        den += w;
                    }

                    const interpolatedV = (exactV !== null) ? exactV : (num / den);
                    posAttr.setY(i, interpolatedV * heightScale);
                    vValues[i] = interpolatedV;
                }

                geometry.setAttribute('vValue', new THREE.BufferAttribute(vValues, 1));
                geometry.computeVertexNormals();

                const customMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        maxV: { value: maxV },
                        contourInterval: { value: 0.5 }
                    },
                    vertexShader: `
                        attribute float vValue;
                        varying float vV;
                        varying vec3 vNormal;
                        varying vec3 vWorldPosition;

                        void main() {
                            vV = vValue;
                            vNormal = normalize(normalMatrix * normal);
                            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                            vWorldPosition = worldPosition.xyz;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float maxV;
                        uniform float contourInterval;
                        varying float vV;
                        varying vec3 vNormal;
                        varying vec3 vWorldPosition;

                        vec3 getColor(float v, float maxVal) {
                            float norm = clamp(v / maxVal, -1.0, 1.0);
                            vec3 green = vec3(0.06, 0.72, 0.5);
                            vec3 red = vec3(0.94, 0.27, 0.27);
                            vec3 blue = vec3(0.23, 0.51, 0.96);

                            if (norm > 0.0) {
                                return mix(green, red, norm);
                            } else {
                                return mix(green, blue, -norm);
                            }
                        }

                        void main() {
                            vec3 baseColor = getColor(vV, maxV);

                            float val = vV / contourInterval;
                            float line = abs(fract(val - 0.5) - 0.5) / fwidth(val);
                            float contour = 1.0 - min(line, 1.0);

                            vec3 lightDir = normalize(vec3(0.5, 1.0, 0.8));
                            float diff = max(dot(vNormal, lightDir), 0.3);

                            vec3 finalColor = mix(baseColor * diff, vec3(1.0, 1.0, 1.0), contour * 0.9);

                            gl_FragColor = vec4(finalColor, 0.92);
                        }
                    `,
                    side: THREE.DoubleSide,
                    transparent: true
                });

                const surfaceMesh = new THREE.Mesh(geometry, customMaterial);
                surfaceGroup.add(surfaceMesh);
            }

            updateVisibility();
        }

        window.onload = initThree;
    </script>
</body>
</html>
